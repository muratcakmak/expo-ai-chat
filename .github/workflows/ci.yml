name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, build, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 10 — version comes from the root "packageManager" field (pnpm@10.x).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint module
        run: pnpm --filter expo-ai-composer lint

      - name: Build module
        run: pnpm --filter expo-ai-composer build

      - name: Test module
        run: pnpm --filter expo-ai-composer test

      - name: Typecheck module tests
        run: pnpm --filter expo-ai-composer typecheck:test

      - name: Typecheck app
        run: pnpm --filter app exec tsc --noEmit
